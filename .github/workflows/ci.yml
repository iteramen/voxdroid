name: CI

# Runs every [[gate]] from .claude/ouro.toml, then the synthetic handset-helper checks.
on:
  pull_request:
    branches: [main, feat/read-aloud]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Gates from the binding
        uses: iteramen/ouro/actions/gates@a7f2c42cf472796736e45999b239b26f41bfc220 # v1.12.0

      - name: Handset test-helper checks (synthetic data only)
        run: python3 -m unittest discover -s tools -p 'test_caption_test_*.py'

      - name: Play listing text and artwork checks
        run: python3 tools/check_play_package.py
