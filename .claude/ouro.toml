# Binding for ouro (https://github.com/iteramen/ouro), the issue-to-PR workflow this repo is
# developed with.
schema = 1

[repo]
slug = "iteramen/voxdroid"
default_branch = "main"
protected_branch_prefixes = []

[labels]
scope = []
area = []
type = ["bug", "enhancement", "documentation"]

# The Windows acceptance runner and Linux CI command execute the same Gradle tasks.
# CI is the final validation authority; local Windows/WSL results are supporting evidence.
[[gate]]
run = "pwsh -NoProfile -Command \"wsl -d Ubuntu-22.04 -- bash -lc './gradlew lint testDebugUnitTest assembleDebug'\""
ci = "./gradlew lint testDebugUnitTest assembleDebug"

[ship]
policy = "stop-at-pr"
review = "adversarial-review"
validation = "ci"
validation_checks = ["gates"]
test_first_for_bugs = true

[rolling_issues]
loop_runs = "Loop runs"

[authority]
local = ["CONTRIBUTING.md"]

[overlays]
implement = ["CONTRIBUTING.md"]
land = []

[owner]
role = "loop owner"
ruling_approvers = ["BoJl4apa"]
